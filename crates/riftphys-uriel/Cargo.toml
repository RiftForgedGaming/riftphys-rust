[package]
name = "riftphys-uriel"
version = "0.1.0"
edition = "2021"
description = "URIEL robotics protocol for RiftPhys: deterministic scenarios (drones, squads, biped, seam-tracking arm), expert demonstrations and JSONL telemetry"

[lib]
name = "riftphys_uriel"
path = "src/lib.rs"

[[bin]]
name = "riftphys-uriel-rollout"
path = "src/bin/rollout.rs"

[[bin]]
name = "riftphys-uriel-seam"
path = "src/bin/seam.rs"

[dependencies]
riftphys-core = { path = "../riftphys-core" }
riftphys-geom = { path = "../riftphys-geom" }
riftphys-world = { path = "../riftphys-world" }
riftphys-materials = { path = "../riftphys-materials" }
riftphys-articulation = { path = "../riftphys-articulation" }
riftphys-collision = { path = "../riftphys-collision" }
glam = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
